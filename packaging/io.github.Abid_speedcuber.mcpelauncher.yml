app-id: io.github.Abid_speedcuber.mcpelauncher
runtime: org.kde.Platform
runtime-version: "6.10"
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm21
command: mcpelauncher-ui-qt
finish-args:
  - --allow=multiarch
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --talk-name=org.freedesktop.portal.Desktop
  - --device=all
  - --share=ipc
  - --filesystem=home
  - --env=ALSA_CONFIG_PATH=
  - --env=BROWSER=xdg-open
  - --env=QT_QUICK_CONTROLS_HOVER_ENABLED=1
  - --env=QML_DISABLE_DISK_CACHE=1
add-extensions:
  org.freedesktop.Platform.Compat.i386:
    directory: lib/i386-linux-gnu
    version: "25.08"
  org.freedesktop.Platform.GL32:
    directory: lib/i386-linux-gnu/GL
    version: "1.4"
    versions: "25.08;25.08-extra;1.4"
    subdirectories: true
    no-autodownload: true
    autodelete: false
    add-ld-path: lib
    merge-dirs: vulkan/icd.d;glvnd/egl_vendor.d
    download-if: active-gl-driver
    enable-if: active-gl-driver
modules:
  - name: protobuf
    make-args:
      - -j8
    sources:
      - type: git
        url: https://github.com/protocolbuffers/protobuf.git
        tag: v3.12.3
        commit: 31ebe2ac71400344a5db91ffc13c4ddfb7589f92

  - name: libzip
    buildsystem: cmake-ninja
    build-options:
      config-opts:
        - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
        - -DCMAKE_INSTALL_LIBDIR=lib
    sources:
      - type: git
        url: https://github.com/nih-at/libzip.git
        tag: v1.7.1
        commit: dcd9a0bfe1ac2893d7f62bafb19f0a4d7b08c0f7

  - name: mcpelauncher-client
    buildsystem: cmake
    builddir: true
    build-options:
      env:
        CC: clang
        CXX: clang++
        CFLAGS: ""
        CXXFLAGS: ""
      config-opts:
        - -DGAMEWINDOW_SYSTEM=SDL3
        - -DENABLE_DEV_PATHS=OFF
        - -DFETCHCONTENT_SOURCE_DIR_NLOHMANN_JSON_EXT=../nlohmann_json_ext
        - -DJNI_USE_JNIVM=ON
        - -DBUILD_UI=OFF
        - -DBUILD_WEBVIEW=OFF
        - -DBUILD_CLIENT=ON
        - -DUSE_OWN_CURL=OFF
        - -DCMAKE_BUILD_TYPE=Release
        - -DCMAKE_C_FLAGS=-DNDEBUG
        - -DCMAKE_CXX_FLAGS=-DNDEBUG
        - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      prepend-path: /usr/lib/sdk/llvm21/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm21/lib
    sources:
      - type: git
        url: https://github.com/minecraft-linux/mcpelauncher-manifest.git
        commit: 7938a9d77b5dab83365754672d57d19bf91c3c9b
        disable-shallow-clone: true
      - type: patch
        path: patches/mcpelauncher-client-high-distance-options.patch
      - type: patch
        path: patches/mcpelauncher-client-high-simulation-distance.patch
      - type: patch
        path: patches/mcpelauncher-client-flagship-device-spoof.patch
      - type: patch
        path: patches/mcpelauncher-client-linux-hardware-spoof.patch
      - type: patch
        path: patches/mcpelauncher-client-egl-renderer-spoof.patch
      - type: patch
        path: patches/mcpelauncher-client-distance-diagnostics.patch
      - type: patch
        path: patches/mcpelauncher-client-pthread-sigmask.patch
      - type: patch
        path: patches/mcpelauncher-client-storage-space.patch
      - type: patch
        path: patches/mcpelauncher-client-old-version-compat.patch
      - type: git
        url: https://github.com/gabomdq/SDL_GameControllerDB
        commit: bd4ef5de42d50480c5be6bd54de164140a62f384
        dest: gamecontrollerdb
      - type: file
        url: https://github.com/nlohmann/json/releases/download/v3.7.3/include.zip
        sha512: 8efd82a54472335e548d0d5c375b6f2781b4a0f2dbc5aa0acc3f504277ec455e0782046286cf08eb4864ac8bcaa1a9691af8d0259dd71a9e539cfc12e0478eb5
        dest-filename: nlohmann_json_ext.zip
      - type: shell
        commands:
          - mkdir nlohmann_json_ext
          - cd nlohmann_json_ext && unzip ../nlohmann_json_ext.zip

  - name: mcpelauncher-client32-binary
    buildsystem: simple
    build-commands:
      - install -Dm755 mcpelauncher-client32 /app/bin/mcpelauncher-client32
      - install -Dm644 ld.so.conf /app/etc/ld.so.conf
      - mkdir -p /app/lib/i386-linux-gnu/GL
    sources:
      - type: dir
        path: generated/client32

  - name: mcpelauncher-ui-qt
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      - type: dir
        path: ..
